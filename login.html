<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Death2x Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- INHERITED THEME --- */
        :root {
            --bg: #030303;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #7c3aed;
            --accent-glow: rgba(124, 58, 237, 0.2);
            --accent-hover: #6d28d9;
            --text-main: #ffffff;
            --text-muted: #888888;
            --grid-color: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- LOGIN CONTAINER --- */
        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
            animation: fadeInUp 0.8s ease forwards;
            opacity: 0;
        }

        /* Top decorative line */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-text {
            font-weight: 900;
            letter-spacing: -1px;
            font-size: 1.5rem;
            margin-bottom: 10px;
            display: block;
            text-decoration: none;
            color: var(--text-main);
        }

        .subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* --- FORMS --- */
        .input-group { margin-bottom: 20px; }

        .input-label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 6px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover { background: var(--accent-hover); }

        /* --- TOGGLE LINKS --- */
        .toggle-text {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .toggle-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        
        .toggle-link:hover { text-decoration: underline; }

        .return-link {
            display: block;
            text-align: center;
            margin-top: 30px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-decoration: none;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .return-link:hover { opacity: 1; }

        /* --- ANIMATIONS --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Utility to hide/show forms */
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            
            <div class="header-section">
                <a href="shop.html" class="logo-text">DEATH2X</a>
                <p class="subtitle">SECURE_ACCESS_POINT</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label class="input-label">USER_ID / EMAIL</label>
                    <input type="email" class="input-field" placeholder="user@example.com" required>
                </div>
                
                <div class="input-group">
                    <label class="input-label">PASSWORD</label>
                    <input type="password" class="input-field" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit">AUTHENTICATE</button>

                <p class="toggle-text">
                    New user? <span class="toggle-link" onclick="toggleForm()">Initialize Registration</span>
                </p>
            </form>

            <form id="registerForm" class="hidden">
                <div class="input-group">
                    <label class="input-label">USERNAME</label>
                    <input type="text" class="input-field" placeholder="Create a handle" required>
                </div>

                <div class="input-group">
                    <label class="input-label">EMAIL_ADDRESS</label>
                    <input type="email" class="input-field" placeholder="user@example.com" required>
                </div>
                
                <div class="input-group">
                    <label class="input-label">SET_PASSWORD</label>
                    <input type="password" class="input-field" placeholder="Create password" required>
                </div>

                <button type="submit" class="btn-submit">CREATE_ACCOUNT</button>

                <p class="toggle-text">
                    Already have access? <span class="toggle-link" onclick="toggleForm()">Return to Login</span>
                </p>
            </form>

        </div>

        <a href="shop.html" class="return-link">< cd .. / return_to_shop ></a>
    </div>

    <script>
        function toggleForm() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            
            if (loginForm.classList.contains('hidden')) {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
