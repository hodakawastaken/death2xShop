<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supply | Prashant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #7c3aed;
            --text-main: #ffffff;
            --text-muted: #888888;
            --grid-color: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            overflow-x: hidden; /* Prevent scroll when cart opens */
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; transition: 0.3s; }
        
        /* --- NAV --- */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 0 60px 0; }
        .logo-text { font-weight: 900; letter-spacing: -1px; font-size: 1.2rem; color: var(--text-main); text-decoration: none; }
        .nav-link { 
            font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-muted); 
            border: 1px solid var(--border); padding: 6px 12px; border-radius: 4px; text-decoration: none; 
            margin-left: 10px; cursor: pointer;
        }
        .nav-link:hover { border-color: var(--text-main); color: var(--text-main); }
        .cart-count { color: var(--accent); font-weight: 700; margin-left: 5px; }

        /* --- SHOP GRID --- */
        .page-header h1 { font-size: 3.5rem; font-weight: 900; letter-spacing: -2px; margin-bottom: 20px; line-height: 1;}
        .page-header h1 span { color: var(--text-muted); }
        .page-header p { color: var(--text-muted); border-left: 2px solid var(--accent); padding-left: 20px; margin-bottom: 60px;}

        .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 30px; padding-bottom: 60px; }
        .product-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: 0.3s; }
        .product-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .product-image-area { height: 250px; background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-family: 'JetBrains Mono'; border-bottom: 1px solid var(--border); }
        .product-details { padding: 30px; flex-grow: 1; display: flex; flex-direction: column; }
        .product-footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 20px; margin-top: 20px;}
        .price { font-family: 'JetBrains Mono'; font-weight: 700; }
        
        .btn-buy { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 4px; font-family: 'JetBrains Mono'; font-size: 0.75rem; cursor: pointer; }
        .btn-buy:hover { background: #6d28d9; }
        .btn-disabled { background: transparent; border: 1px solid var(--border); color: var(--text-muted); cursor: not-allowed; padding: 8px 16px; border-radius: 4px; font-family: 'JetBrains Mono'; font-size: 0.75rem; }

        /* --- CART SIDEBAR --- */
        .cart-overlay {
            position: fixed; top: 0; right: -400px; width: 400px; height: 100vh;
            background: #0a0a0a; border-left: 1px solid var(--border);
            z-index: 1000; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column;
            box-shadow: -20px 0 50px rgba(0,0,0,0.5);
        }
        .cart-open .cart-overlay { right: 0; }
        .cart-header { padding: 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .cart-title { font-weight: 900; font-size: 1.5rem; }
        .close-cart { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.5rem; }
        
        .cart-items { flex-grow: 1; overflow-y: auto; padding: 20px; }
        .cart-item { display: flex; gap: 15px; padding: 15px; border-bottom: 1px solid var(--border); align-items: center; }
        .cart-item-details h4 { font-size: 0.9rem; margin-bottom: 4px; }
        .cart-item-price { color: var(--text-muted); font-family: 'JetBrains Mono'; font-size: 0.8rem; }
        .remove-btn { margin-left: auto; color: #ef4444; background: none; border: none; cursor: pointer; font-family: 'JetBrains Mono'; font-size: 0.7rem; }

        .cart-footer { padding: 30px; border-top: 1px solid var(--border); background: var(--surface); }
        .total-row { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: 700; font-size: 1.2rem; }
        .checkout-btn { width: 100%; background: white; color: black; padding: 15px; border: none; font-weight: 900; cursor: pointer; }
        .checkout-btn:hover { background: #ddd; }

        /* Dim background when cart is open */
        .dimmer { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 900; opacity: 0; pointer-events: none; transition: 0.3s; }
        .cart-open .dimmer { opacity: 1; pointer-events: all; }

        @media (max-width: 500px) { .cart-overlay { width: 100%; right: -100%; } }
    </style>
</head>
<body>

    <div class="dimmer" onclick="toggleCart()"></div>

    <div class="cart-overlay">
        <div class="cart-header">
            <span class="cart-title">SYSTEM_CART</span>
            <button class="close-cart" onclick="toggleCart()">×</button>
        </div>
        <div class="cart-items" id="cartItemsContainer">
            <div style="text-align: center; color: var(--text-muted); margin-top: 50px; font-family: 'JetBrains Mono'">[ CART_EMPTY ]</div>
        </div>
        <div class="cart-footer">
            <div class="total-row">
                <span>TOTAL</span>
                <span id="cartTotal">$0.00</span>
            </div>
            <button class="checkout-btn" onclick="alert('CHECKOUT_MODULE: PENDING_INTEGRATION')">PROCEED TO CHECKOUT</button>
        </div>
    </div>

    <div class="container">
        
        <nav>
            <a href="shop.html" class="logo-text">DEATH2X</a>
            <div style="display: flex;">
                <button class="nav-link" onclick="toggleCart()">CART <span id="navCartCount" class="cart-count">0</span></button>
                <a href="login.html" id="authLink" class="nav-link">LOGIN</a>
                <a href="index.html" class="nav-link">cd .. /</a>
            </div>
        </nav>

        <header class="page-header">
            <h1>DEATHX2 <br><span>STORE.</span></h1>
            <p>Equipment, digital assets, and source code.</p>
        </header>

        <section class="shop-grid" id="shopGrid">
        </section>
    </div>

<script>
        // --- 1. PRODUCT DATABASE ---
        // Add your new products here!
        const products = [
            {
                id: 1,
                name: "Portfolio V21",
                price: 5.00,
                desc: "The Frontend + Backend code that you can copy to get this exact same website.",
                image: "[ IMAGE_NOT_FOUND ]",
                locked: false
            },
            {
                id: 2,
                name: "Portfolio V22",
                price: 18.00,
                desc: "Matte black ceramic. Keeps coffee hot while debugging.",
                image: "[ MUG_RENDER.obj ]",
                locked: false
            },
            {
                id: 3,
                name: "Mechanical Keycaps",
                price: 45.00,
                desc: "Custom PBT keycaps. Dark grey with purple legends.",
                image: "[ KEY_SET_V1 ]",
                locked: false
            },
            {
                id: 4,
                name: "Protocol Sticker Pack",
                price: 12.00,
                desc: "Holographic vinyl stickers for your laptop lid.",
                image: "[ ASSET_LOADED ]",
                locked: false
            },
            {
                id: 5,
                name: "Neural Link (Beta)",
                price: 149.99,
                desc: "Experimental hardware interface. use at own risk.",
                image: "[ HARDWARE_DETECTED ]",
                locked: false
            },
            {
                id: 99, // Special ID
                name: "Private Source Code",
                price: 500.00, // Price when unlocked
                desc: "Complete access to personal algorithm library.",
                image: "[ SOURCE_LOCKED ]",
                locked: true // This triggers the logic below
            }
        ];

        // --- 2. AUTH CHECK ---
        const authLink = document.getElementById('authLink');
        const userEmail = localStorage.getItem('death2x_user');
        const token = localStorage.getItem('death2x_token');
        const isLoggedIn = (token && userEmail);

        if (isLoggedIn) {
            const shortName = userEmail.split('@')[0];
            authLink.innerText = "PROFILE [" + shortName + "]";
            authLink.href = "profile.html"; // Ensure this page exists or link to shop
        } else {
            authLink.innerText = "LOGIN / SIGNUP";
            authLink.href = "login.html";
        }

        // --- 3. RENDER SHOP ---
        const shopGrid = document.getElementById('shopGrid');

        // Safety check to ensure the element exists before running loop
        if (shopGrid) {
            products.forEach(product => {
                // Check if this is the special locked item
                let isLocked = product.locked && !isLoggedIn;
                
                // Logic for the Button and Price display
                let btnHTML = '';
                let priceDisplay = `$${product.price.toFixed(2)}`;

                if (isLocked) {
                    // If it's locked and user is NOT logged in
                    priceDisplay = "INVALID";
                    btnHTML = `<button class="btn-disabled" disabled>OUT_OF_STOCK</button>`;
                } else if (product.locked && isLoggedIn) {
                    // If it was locked, but user IS logged in -> Show "ACCESS_GRANTED"
                    btnHTML = `<button class="btn-buy" onclick="addToCart('${product.name}', ${product.price})">ACCESS_GRANTED</button>`;
                } else {
                    // Normal product
                    btnHTML = `<button class="btn-buy" onclick="addToCart('${product.name}', ${product.price})">ADD_TO_CART</button>`;
                }

                // Create the HTML Card
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-image-area">${product.image}</div>
                    <div class="product-details">
                        <h3 class="product-title">${product.name}</h3>
                        <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:20px;">${product.desc}</p>
                        <div class="product-footer">
                            <span class="price">${priceDisplay}</span>
                            ${btnHTML}
                        </div>
                    </div>
                `;
                shopGrid.appendChild(card);
            });
        } else {
            console.error("Error: Element with id 'shopGrid' not found.");
        }

        // --- 4. CART LOGIC (unchanged) ---
        let cart = JSON.parse(localStorage.getItem('death2x_cart')) || [];

        function toggleCart() {
            document.body.classList.toggle('cart-open');
        }

        function addToCart(title, price) {
            cart.push({ title, price, id: Date.now() });
            saveCart();
            renderCart();
            document.body.classList.add('cart-open');
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            saveCart();
            renderCart();
        }

        function saveCart() {
            localStorage.setItem('death2x_cart', JSON.stringify(cart));
            updateNavCount();
        }

        function updateNavCount() {
            const countElement = document.getElementById('navCartCount');
            if(countElement) countElement.innerText = cart.length;
        }

        function renderCart() {
            const container = document.getElementById('cartItemsContainer');
            const totalEl = document.getElementById('cartTotal');
            
            if (!container || !totalEl) return;

            if (cart.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-muted); margin-top: 50px; font-family: \'JetBrains Mono\'">[ CART_EMPTY ]</div>';
                totalEl.innerText = "$0.00";
                updateNavCount();
                return;
            }

            let html = '';
            let total = 0;

            cart.forEach(item => {
                total += item.price;
                html += `
                <div class="cart-item">
                    <div class="cart-item-details">
                        <h4>${item.title}</h4>
                        <span class="cart-item-price">$${item.price.toFixed(2)}</span>
                    </div>
                    <button class="remove-btn" onclick="removeFromCart(${item.id})">REMOVE</button>
                </div>
                `;
            });

            container.innerHTML = html;
            totalEl.innerText = "$" + total.toFixed(2);
            updateNavCount();
        }

        // Initial Render
        renderCart();
    </script>
</body>
</html>
